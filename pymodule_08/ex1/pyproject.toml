[project]
name = "matrix-data"
version = "0.1.0"
description = "Program that shows basic of dependecies management"
authors = [
    {name = "Nicolas"}
]
requires-python = ">=3.12"
dependencies = [
    "pandas (>=1.25.0)",
    "numpy (>=1.25.0)",
    "requests (>=2.34.2,<3.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)"
]

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
